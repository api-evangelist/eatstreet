aid: eatstreet
name: EatStreet
description: >-
  EatStreet is a Madison, Wisconsin online food ordering and delivery marketplace,
  founded in 2010, that connects diners with local restaurants for takeout and
  delivery across US college towns and midsize metros, and sells restaurants an
  ordering, menu and point-of-sale integration platform on the merchant side. It
  once ran a documented public API — restaurant search, menus, order placement and
  tracking, and user management — at api.eatstreet.com/publicapi/v1, documented at
  developers.eatstreet.com. That surface is retired: the documentation host and
  every documented v1 path now return 404, though the company GitHub organization
  still points developers at the dead portal. What remains live is an OAuth 2.0
  protected v2 API on the consumer host, whose only public, machine-readable
  contract is the RFC 8414 authorization server metadata EatStreet serves at
  /.well-known/oauth-authorization-server, advertising merchant_integration and
  customer scopes with PKCE.
