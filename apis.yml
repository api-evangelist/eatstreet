apis:
- name: EatStreet API v2
  description: >-
    The live EatStreet API, served under https://eatstreet.com/api/v2 and protected
    by OAuth 2.0 authorization code with PKCE. EatStreet publishes no reference,
    no OpenAPI and no developer portal for it; the only public contract is the
    RFC 8414 authorization server metadata, which names the authorize, token,
    introspection and revocation endpoints and the three advertised scopes
    (merchant_integration, customer, example). The router is live and answers
    unauthenticated probes with structured JSON errors, but the resource path
    space is undiscoverable without credentials.
  humanURL: https://eatstreet.com/
  baseURL: https://eatstreet.com/api/v2
